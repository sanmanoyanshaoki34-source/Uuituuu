<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DATING ANALYZER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');

    :root {
      --bg: #10101a;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --text: #f2f2f6;
      --muted: #8888aa;
      --faint: #44445a;
      --green: #34d399;
      --r: 16px;
      /* デフォルトは男性テーマカラー */
      --accent: #5b8dff;
      --accent-light: rgba(91,141,255,0.14);
      --accent-border: rgba(91,141,255,0.28);
      --p: var(--accent);
      --pl: var(--accent-light);
      --pb: var(--accent-border);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }
    
    /* 背景エフェクト */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); transition: background 0.5s; }
    .b1 { width: 500px; height: 500px; top: -150px; right: -100px; background: var(--p); opacity: 0.08; }
    .b2 { width: 400px; height: 400px; bottom: -100px; left: -80px; background: #a855f7; opacity: 0.07; }
    .b3 { width: 300px; height: 300px; top: 40%; left: 30%; background: var(--p); opacity: 0.04; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 40px 40px; }
    
    .page { position: relative; z-index: 1; max-width: 540px; margin: 0 auto; padding: 28px 16px 80px; }
    
    /* Header */
    .hdr { text-align: center; margin-bottom: 32px; }
    .hdr-badge { display: inline-flex; align-items: center; gap: 7px; background: var(--pl); border: 1px solid var(--pb); color: var(--p); font-size: 10px; font-family: 'Outfit', sans-serif; font-weight: 600; letter-spacing: 2px; padding: 5px 14px; border-radius: 100px; margin-bottom: 16px; transition: all 0.3s; }
    .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--p); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1) } 50% { opacity: 0.4; transform: scale(0.8) } }
    .hdr-title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: clamp(52px, 14vw, 84px); line-height: 0.88; letter-spacing: -1px; background: linear-gradient(145deg, #fff 0%, var(--p) 60%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; transition: all 0.3s; }
    .hdr-sub { font-size: 12px; color: var(--muted); margin-top: 12px; }

    /* Steps */
    .steps { display: flex; align-items: center; margin-bottom: 24px; }
    .s-item { display: flex; align-items: center; flex: 1; gap: 7px; }
    .s-num { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: 'Outfit', sans-serif; flex-shrink: 0; transition: all 0.3s; }
    .s-num.done { background: var(--green); color: #000; }
    .s-num.active { background: var(--p); color: #fff; box-shadow: 0 0 16px var(--pl); }
    .s-num.idle { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); }
    .s-lbl { font-size: 10px; color: var(--muted); white-space: nowrap; display: none; }
    @media(min-width: 380px) { .s-lbl { display: block } }
    .s-line { flex: 1; height: 1px; background: var(--border); margin: 0 6px; transition: background 0.3s; }
    .s-line.done { background: var(--green); }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 12px; transition: border-color 0.2s; }
    .card:focus-within { border-color: var(--pb); }
    .card-head { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }
    .c-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; background: var(--pl); }
    .c-title { font-size: 14px; font-weight: 700; font-family: 'Outfit', sans-serif; color: var(--text); }
    .c-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .opt-tag { font-size: 9px; letter-spacing: 1px; color: var(--faint); background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 2px 8px; border-radius: 100px; margin-left: auto; }

    /* Gender */
    .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .gender-btn { padding: 22px 16px; border-radius: 14px; border: 2px solid var(--border); background: rgba(255,255,255,0.03); cursor: pointer; text-align: center; transition: all 0.25s; }
    .gender-btn:hover { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); }
    .gender-btn.sel-m { border-color: #5b8dff; background: rgba(91,141,255,0.1); box-shadow: 0 0 20px rgba(91,141,255,0.15); }
    .gender-btn.sel-f { border-color: #ff6b9d; background: rgba(255,107,157,0.1); box-shadow: 0 0 20px rgba(255,107,157,0.15); }
    .g-emoji { font-size: 36px; margin-bottom: 8px; }
    .g-label { font-size: 14px; font-weight: 700; font-family: 'Outfit', sans-serif; color: var(--text); }
    .g-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* MBTI */
    .mbti-group { margin-bottom: 14px; }
    .mbti-gname { font-size: 10px; font-weight: 600; letter-spacing: 2px; margin-bottom: 8px; font-family: 'Outfit', sans-serif; }
    .mbti-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .mbti-btn { padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.03); cursor: pointer; text-align: center; transition: all 0.2s; }
    .mbti-btn:hover { border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.06); }
    .mbti-btn.active { border-width: 2px; }
    .mbti-type { font-size: 13px; font-weight: 700; font-family: 'Outfit', sans-serif; }
    .mbti-desc { font-size: 9px; color: var(--muted); margin-top: 2px; }

    /* Textarea */
    .ta { width: 100%; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 13px 14px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.75; resize: none; outline: none; transition: border-color 0.2s; }
    .ta:focus { border-color: var(--pb); }
    .ta::placeholder { color: var(--faint); }
    .char-count { text-align: right; font-size: 10px; color: var(--faint); margin-top: 5px; }

    /* Height slider */
    .h-display { text-align: center; margin-bottom: 20px; }
    .h-num { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; transition: color 0.4s; }
    .h-unit { font-size: 24px; opacity: 0.45; font-weight: 500; }
    .h-tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 1px; padding: 4px 14px; border-radius: 100px; margin-top: 7px; transition: all 0.4s; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer; background: linear-gradient(90deg, var(--sc, #5b8dff) var(--sp, 50%), rgba(255,255,255,0.08) var(--sp, 50%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--sc, #5b8dff); box-shadow: 0 2px 14px rgba(0,0,0,0.4); cursor: pointer; }
    input[type=range]::-webkit-slider-thumb:active { box-shadow: 0 0 0 8px rgba(91,141,255,0.15); }
    .slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); margin-top: 8px; }
    .h-note { margin-top: 12px; background: rgba(255,255,255,0.025); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 11px; color: var(--muted); line-height: 1.75; }
    .h-note b { color: #f59e0b; }

    /* Photo Upload */
    .drop-zone { border: 2px dashed rgba(255,255,255,0.1); border-radius: 12px; padding: 34px 16px; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(0,0,0,0.15); position: relative; }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--pb); background: var(--pl); }
    .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop-icon { font-size: 38px; margin-bottom: 10px; }
    .drop-main { font-size: 14px; font-weight: 600; font-family: 'Outfit', sans-serif; color: #ccc; }
    .drop-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .prev-wrap { position: relative; border-radius: 12px; overflow: hidden; }
    .prev-img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .prev-over { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; gap: 10px; opacity: 0; transition: opacity 0.2s; }
    .prev-wrap:hover .prev-over { opacity: 1; }
    .prev-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 12px; font-family: 'Outfit', sans-serif; padding: 8px 16px; border-radius: 8px; cursor: pointer; z-index: 2; position: relative;}
    .prev-btn.del { border-color: rgba(255,100,100,0.3); color: #ff8888; }

    /* Buttons */
    .nav { display: flex; gap: 10px; margin-top: 14px; }
    .btn-back { flex: 1; padding: 15px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-back:hover { border-color: rgba(255,255,255,0.16); color: var(--text); }
    .btn-next { flex: 2; padding: 15px; background: var(--p); border: none; border-radius: 12px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px var(--pl); }
    .btn-next:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 28px var(--pl); }
    .btn-next:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-go { width: 100%; padding: 17px; background: var(--p); border: none; border-radius: 12px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px var(--pl); margin-top: 6px; }
    .btn-go:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 32px var(--pl); }
    .btn-go:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-reset { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-size: 13px; font-family: 'Outfit', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
    .btn-reset:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }

    /* Loading */
    .load { text-align: center; padding: 90px 24px; animation: up 0.4s ease; display: none; }
    .load-ring { width: 58px; height: 58px; border: 3px solid rgba(255,255,255,0.06); border-top-color: var(--p); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 26px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .load-label { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: 2px; color: #fff; margin-bottom: 10px; }
    .load-msg { font-size: 13px; color: var(--muted); }
    .bar-wrap { height: 3px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-top: 26px; }
    .bar-ani { height: 100%; background: var(--p); animation: bar 2s ease-in-out infinite; }
    @keyframes bar { 0% { width: 0%; margin-left: 0 } 50% { width: 70%; margin-left: 0 } 100% { width: 0%; margin-left: 100% } }

    /* Result Elements */
    .res-hdr { text-align: center; margin-bottom: 20px; animation: up 0.4s ease; }
    .res-eyebrow { font-size: 10px; font-family: 'Outfit', sans-serif; letter-spacing: 3px; color: var(--muted); margin-bottom: 10px; }
    .tag-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 700; font-family: 'Outfit', sans-serif; background: var(--pl); color: var(--p); border: 1px solid var(--pb); }
    .tag-mbti { background: rgba(168,85,247,0.12); color: #c084fc; border: 1px solid rgba(168,85,247,0.25); margin-left: 6px; }

    /* Rank Bar */
    .rank-card { background: var(--card); border: 1px solid rgba(255,255,255,0.09); border-radius: var(--r); padding: 24px; text-align: center; margin-bottom: 12px; animation: up 0.5s ease; }
    .rank-eyebrow { font-size: 9px; letter-spacing: 3px; color: var(--muted); font-family: 'Outfit', sans-serif; margin-bottom: 8px; }
    .rank-big { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 62px; line-height: 1; color: #fff; }
    .rank-big em { font-style: normal; font-size: 26px; color: var(--muted); font-weight: 500; }
    .rank-verdict { font-size: 13px; font-weight: 700; color: var(--p); margin: 8px 0 20px; }
    .rbar-outer { position: relative; }
    .rbar-bg { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); overflow: hidden; }
    .rbar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #ef4444, #f59e0b, #34d399); transition: width 1.6s cubic-bezier(.22,1,.36,1); width: 0%; }
    .rbar-thumb { position: absolute; top: -8px; transform: translateX(-50%); transition: left 1.6s cubic-bezier(.22,1,.36,1); left: 0%; }
    .rbar-dot { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--p); box-shadow: 0 0 16px var(--pl); }
    .rbar-lbl { font-size: 9px; font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--p); letter-spacing: 1px; text-align: center; margin-top: 2px; }
    .rbar-ends { display: flex; justify-content: space-between; font-size: 9px; color: var(--faint); margin-top: 28px; }

    /* Score Grid */
    .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; animation: up 0.5s 0.06s ease both; }
    .score-cell { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 14px; padding: 18px 14px; text-align: center; }
    .score-lbl { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; font-family: 'Outfit', sans-serif; margin-bottom: 6px; }
    .score-n { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 54px; line-height: 1; }
    .score-n.lo { color: #ef4444 } .score-n.mi { color: #f59e0b } .score-n.hi { color: #34d399 }
    .score-pct { font-size: 22px; opacity: 0.4; font-weight: 500; }
    .score-chip { display: inline-block; font-size: 10px; font-weight: 700; font-family: 'Outfit', sans-serif; letter-spacing: 1px; padding: 3px 10px; border-radius: 100px; margin-top: 7px; }

    /* Verdict */
    .verdict { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.09); border-left: 3px solid var(--p); border-radius: var(--r); padding: 18px; margin-bottom: 12px; animation: up 0.5s 0.1s ease both; }
    .verdict-eye { font-size: 9px; letter-spacing: 3px; color: var(--p); font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .verdict-txt { font-size: 14px; font-weight: 600; color: #eeeeff; line-height: 1.8; }

    /* Sub-scores & Details */
    .sub-scores { margin: 12px 0; }
    .sub-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .sub-lbl { font-size: 11px; color: var(--muted); width: 90px; flex-shrink: 0; font-family: 'Outfit', sans-serif; }
    .sub-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .sub-bar { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(.22,1,.36,1); }
    .sub-val { font-size: 11px; font-weight: 700; font-family: 'Outfit', sans-serif; width: 32px; text-align: right; flex-shrink: 0; }
    .sub-comment { font-size: 10px; color: var(--faint); margin-top: -4px; margin-left: 100px; margin-bottom: 6px; }
    
    .rewrite-box { background: rgba(52,211,153,0.06); border: 1px solid rgba(52,211,153,0.2); border-radius: 10px; padding: 14px; margin: 14px 0; }
    .rewrite-label { font-size: 9px; letter-spacing: 2px; color: #34d399; font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 8px; }
    .rewrite-text { font-size: 13px; color: #ccffec; line-height: 1.8; font-style: italic; }

    .dc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-bottom: 12px; animation: up 0.5s ease both; }
    .dc.c0 { border-left: 3px solid var(--p); }
    .dc.c1 { border-left: 3px solid #f59e0b; }
    .dc.c2 { border-left: 3px solid #a855f7; }
    .dc.c3 { border-left: 3px solid #34d399; }
    .dc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .dc-icon { font-size: 18px; }
    .dc-cat { font-size: 9px; letter-spacing: 3px; font-family: 'Outfit', sans-serif; font-weight: 700; text-transform: uppercase; }
    .dc.c0 .dc-cat { color: var(--p) } .dc.c1 .dc-cat { color: #f59e0b } .dc.c2 .dc-cat { color: #a855f7 } .dc.c3 .dc-cat { color: #34d399 }
    .dc-thumb { width: 100%; max-height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 14px; opacity: 0.72; }
    .dc-sum { font-size: 14px; font-weight: 700; font-family: 'Outfit', sans-serif; color: #fff; margin-bottom: 10px; line-height: 1.5; }
    .dc-body { font-size: 13px; color: #9999bb; line-height: 1.9; }
    .dc-body strong { color: #ffb3c6; }
    .dc-pts { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 4px; }
    .dc-pt { display: flex; gap: 9px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 12px; line-height: 1.7; color: #aaaabb; }
    .dc-pt:last-child { border-bottom: none; }
    .dc-badge { font-size: 9px; font-weight: 700; font-family: 'Outfit', sans-serif; letter-spacing: 1px; padding: 3px 8px; border-radius: 5px; flex-shrink: 0; margin-top: 2px; }
    .dc-badge.ng { background: rgba(239,68,68,0.14); color: #f87171; }
    .dc-badge.fix { background: rgba(245,158,11,0.14); color: #fbbf24; }

    /* MBTI Analysis */
    .mbti-card { background: rgba(168,85,247,0.06); border: 1px solid rgba(168,85,247,0.18); border-radius: var(--r); padding: 20px; margin-bottom: 12px; animation: up 0.5s ease both; }
    .mbti-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .mbti-card-type { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; color: #c084fc; }
    .mbti-card-name { font-size: 11px; color: var(--muted); }
    .mbti-row2 { margin-bottom: 12px; }
    .mbti-row-label { font-size: 9px; letter-spacing: 2px; font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 5px; }
    .mbti-strength .mbti-row-label { color: #34d399; } .mbti-weakness .mbti-row-label { color: #f87171; } .mbti-tip .mbti-row-label { color: #c084fc; }
    .mbti-row-text { font-size: 12px; color: #aaaabb; line-height: 1.75; }

    /* Strategy */
    .strat-card { background: linear-gradient(135deg, rgba(91,141,255,0.07), rgba(168,85,247,0.05)); border: 1px solid rgba(91,141,255,0.15); border-radius: var(--r); padding: 20px; margin-bottom: 12px; animation: up 0.5s ease both; }
    .strat-head { font-size: 9px; letter-spacing: 3px; color: var(--p); font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
    .strat-headline { font-size: 15px; font-weight: 700; font-family: 'Outfit', sans-serif; color: #fff; margin-bottom: 14px; line-height: 1.5; }
    .strat-height { font-size: 12px; color: #aaaabb; background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.7; border-left: 2px solid var(--p); }
    .strat-action { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .strat-action:last-child { border-bottom: none; }
    .strat-timing { font-size: 10px; font-weight: 700; font-family: 'Outfit', sans-serif; color: var(--p); white-space: nowrap; padding-top: 2px; min-width: 60px; }
    .strat-text { font-size: 12px; color: #aaaabb; line-height: 1.7; }

    /* Future */
    .future { background: linear-gradient(135deg, rgba(52,211,153,0.07), rgba(20,150,80,0.04)); border: 1px solid rgba(52,211,153,0.15); border-radius: var(--r); padding: 20px; margin-bottom: 12px; animation: up 0.5s ease both; }
    .f-head { font-size: 9px; letter-spacing: 3px; color: var(--green); font-family: 'Outfit', sans-serif; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 7px; }
    .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

        </div>
        <div class="nav">
          <button class="btn-next" onclick="app.goStep(1)" ${!state.gender ? 'disabled' : ''}>次へ →</button>
        </div>
      `;
      document.getElementById('viewStep0').innerHTML = html;
    }

    /* Step 1 */
    function renderStep1() {
      const cfg = HCfg[state.gender] || HCfg.male;
      const band = hBand(state.height, state.gender);
      const marks = state.gender === "male" ? [cfg.min, 165, 175, 185, cfg.max] : [cfg.min, 153, 160, 168, cfg.max];
      const pct = ((state.height - cfg.min) / (cfg.max - cfg.min)) * 100;

      const getNote = () => {
        const v = state.height;
        if(state.gender === "male") {
          if(v<165) return `身長${v}cmはアプリでは<b>厳しい条件</b>。写真・プロフの質で徹底的に補う必要があります。`;
          if(v<170) return `身長${v}cmは平均以下。<b>写真と文章力</b>で差を埋めることは十分可能です。`;
          if(v<175) return `身長${v}cmは一般的な範囲。<b>他の要素の質</b>が勝負を分けます。`;
          if(v<180) return `身長${v}cmは<b>有利な水域</b>。他の要素を整えれば高いマッチ率が期待できます。`;
          return `身長${v}cmは<b>大きなアドバンテージ</b>。ただし身長だけでは勝てません。`;
        } else {
          if(v<153) return `身長${v}cmは小柄。<b>かわいい系</b>の路線でプロフ・写真を統一すると効果的です。`;
          if(v<160) return `身長${v}cmは女性の平均域。<b>写真の撮り方</b>でスタイルを印象付けられます。`;
          if(v<168) return `身長${v}cmはやや高め。<b>スタイルの良さ</b>を自然にアピールできる強みです。`;
          return `身長${v}cmは高め。<b>雰囲気・スタイル</b>を活かした写真選びが重要です。`;
        }
      };

      const html = `
        <div class="card">
          <div class="card-head"><div class="c-icon">📝</div>
            <div><div class="c-title">プロフィール文</div><div class="c-sub">現在のプロフをそのまま貼り付け</div></div>
          </div>
          <textarea class="ta" id="profileTa" rows="7" oninput="app.updateProfile(this.value)" placeholder="${state.gender === "female" ? "例：都内でOLをしています。休日はカフェ巡りや料理が好きです♪..." : "例：都内でエンジニアをしています。休日は料理や筋トレが好きで..."}">${state.profile}</textarea>
          <div class="char-count" id="charCount">${state.profile.length} 字</div>
        </div>
        <div class="card">
          <div class="card-head"><div class="c-icon">📏</div>
            <div><div class="c-title">身長</div><div class="c-sub">マッチ率と戦略アドバイスに反映します</div></div>
          </div>
          <div>
            <div class="h-display">
              <div class="h-num" id="hNum" style="color:${band.c}">${state.height}<span class="h-unit">cm</span></div>
              <div class="h-tag" id="hTag" style="background:${band.c}18;color:${band.c}">${band.t}</div>
            </div>
            <input type="range" id="hRange" min="${cfg.min}" max="${cfg.max}" value="${state.height}" style="--sp:${pct}%;--sc:${band.c}" oninput="app.updateHeight(Number(this.value))"/>
            <div class="slider-labels">${marks.map(m => `<span>${m}cm</span>`).join('')}</div>
            <div class="h-note" id="hNote">${getNote()}</div>
          </div>
        </div>
        <div class="nav">
          <button class="btn-back" onclick="app.goStep(0)">← 戻る</button>
          <button class="btn-next" id="s1Next" onclick="app.goStep(2)" ${!state.profile.trim() ? 'disabled' : ''}>次へ →</button>
        </div>
      `;
      document.getElementById('viewStep1').innerHTML = html;
    }

    /* Step 2 */
    function renderStep2() {
      const th = getT(state.gender);
      const dropZoneHtml = state.photoUrl 
        ? `
          <div class="prev-wrap">
            <img src="${state.photoUrl}" class="prev-img" alt=""/>
            <div class="prev-over">
              <button class="prev-btn" onclick="document.getElementById('fileInp').click()">📷 変更</button>
              <button class="prev-btn del" onclick="app.clearPhoto(event)">✕ 削除</button>
            </div>
            <input id="fileInp" type="file" accept="image/*" style="display:none" onchange="app.handleFile(this.files)"/>
          </div>
        `
        : `
          <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInp').click()">
            <div class="drop-icon">📷</div>
            <div class="drop-main">写真をアップロード</div>
            <div class="drop-sub">タップして選択、またはドラッグ＆ドロップ</div>
            <input id="fileInp" type="file" accept="image/*" onchange="app.handleFile(this.files)"/>
          </div>
        `;

      const html = `
        <div class="card">
          <div class="card-head"><div class="c-icon">📷</div>
            <div><div class="c-title">メイン写真</div><div class="c-sub">AIが実際に画像を見て4軸評価します</div></div>
            <span class="opt-tag">任意</span>
          </div>
          ${dropZoneHtml}
        </div>
        <div class="nav">
          <button class="btn-back" onclick="app.goStep(1)">← 戻る</button>
        </div>
        <button class="btn-go" onclick="app.analyze()">
          ${th.emoji} 今すぐ診断する →
        </button>
      `;
      document.getElementById('viewStep2').innerHTML = html;

      // Drag & Drop bindings
      setTimeout(() => {
        const dz = document.getElementById('dropZone');
        if(!dz) return;
        dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
        dz.ondragleave = e => { dz.classList.remove('drag'); };
        dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); app.handleFile(e.dataTransfer.files); };
      }, 0);
    }

    /* Result */
    function renderResult() {
      if (!state.result) return;
      const res = state.result;
      const th = getT(state.gender);

      const makeSubScores = scores => {
        if(!scores || !scores.length) return '';
        return `<div class="sub-scores">` + scores.map(s => {
          const col = s.score === null ? "#444" : s.score < 35 ? "#ef4444" : s.score < 60 ? "#f59e0b" : "#34d399";
          return `
            <div>
              <div class="sub-row">
                <div class="sub-lbl">${s.label}</div>
                <div class="sub-bar-wrap">
                  <div class="sub-bar" style="width:${s.score !== null ? s.score : 0}%; background:${col}"></div>
                </div>
                <div class="sub-val" style="color:${col}">${s.score !== null ? s.score : "—"}</div>
              </div>
              ${s.comment ? `<div class="sub-comment">${s.comment}</div>` : ''}
            </div>
          `;
        }).join('') + `</div>`;
      };

      const makeDCard = (ci, icon, label, data, thumb=null) => {
        if(!data) return '';
        const bodyParsed = (data.body||"").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        return `
          <div class="dc c${ci}">
            <div class="dc-head"><span class="dc-icon">${icon}</span><div class="dc-cat">${label}</div></div>
            ${thumb ? `<img src="${thumb}" class="dc-thumb" alt=""/>` : ''}
            <div class="dc-sum">${data.summary}</div>
            ${makeSubScores(data.scores)}
            <div class="dc-body">${bodyParsed}</div>
            ${data.rewrite ? `
              <div class="rewrite-box">
                <div class="rewrite-label">✏ 改善後プロフ例</div>
                <div class="rewrite-text">「${data.rewrite}」</div>
              </div>
            ` : ''}
            ${data.points && data.points.length > 0 ? `
              <div class="dc-pts">
                ${data.points.map(p => `
                  <div class="dc-pt">
                    <span class="dc-badge ${p.type==="ng"?"ng":"fix"}">${p.type==="ng"?"問題":"改善"}</span>
                    <span>${p.text}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      };

      const scoreChip = v => {
        if(v<20) return {t:"D RANK",bg:"rgba(239,68,68,0.14)",c:"#f87171"};
        if(v<40) return {t:"C RANK",bg:"rgba(245,158,11,0.14)",c:"#fbbf24"};
        if(v<60) return {t:"B RANK",bg:"rgba(234,179,8,0.14)",c:"#eab308"};
        if(v<80) return {t:"A RANK",bg:"rgba(52,211,153,0.14)",c:"#34d399"};
        return {t:"S RANK",bg:"rgba(96,165,250,0.14)",c:"#60a5fa"};
      };

      const mc = scoreChip(res.matchRate);
      const dc = scoreChip(res.dateRate);

      const html = `
        <div class="res-hdr">
          <div class="res-eyebrow">診断レポート</div>
          <div>
            <span class="tag-pill">${th.emoji} ${th.label}プロフ診断</span>
            ${state.mbti ? `<span class="tag-pill tag-mbti">🧠 ${state.mbti}</span>` : ''}
          </div>
        </div>

        <div class="rank-card">
          <div class="rank-eyebrow">全体順位</div>
          <div class="rank-big">上位<em> </em>${100 - res.percentile}<em>%</em></div>
          <div class="rank-verdict">${res.percentile <= 20 ? "圧倒的最下位層" : res.percentile <= 35 ? "平均以下" : res.percentile <= 55 ? "平均的" : res.percentile <= 75 ? "やや有利" : "上位層"}</div>
          <div class="rbar-outer">
            <div class="rbar-bg"><div class="rbar-fill" id="rbarFill"></div></div>
            <div class="rbar-thumb" id="rbarThumb">
              <div class="rbar-dot"></div><div class="rbar-lbl">あなた</div>
            </div>
            <div class="rbar-ends"><span>最下位</span><span>平均</span><span>上位10%</span></div>
          </div>
        </div>

        <div class="score-grid">
          <div class="score-cell">
            <div class="score-lbl">マッチ率</div>
            <div class="score-n ${res.matchRate < 30 ? 'lo' : res.matchRate < 60 ? 'mi' : 'hi'}" id="scoreM">0<span class="score-pct">%</span></div>
            <div class="score-chip" style="background:${mc.bg};color:${mc.c}">${mc.t}</div>
          </div>
          <div class="score-cell">
            <div class="score-lbl">デート成功率</div>
            <div class="score-n ${res.dateRate < 30 ? 'lo' : res.dateRate < 60 ? 'mi' : 'hi'}" id="scoreD">0<span class="score-pct">%</span></div>
            <div class="score-chip" style="background:${dc.bg};color:${dc.c}">${dc.t}</div>
          </div>
        </div>

        <div class="verdict">
          <div class="verdict-eye"><span>💬</span> 総評</div>
          <div class="verdict-txt">${res.verdict}</div>
        </div>

        ${makeDCard(0, "📝", "プロフィール診断 — 4軸分析", res.profile)}
        ${makeDCard(1, "📷", "写真診断 — AI視覚評価", res.photo, state.resultImg)}
        
        ${res.mbtiAnalysis && state.mbti ? `
          <div class="mbti-card">
            <div class="mbti-card-head">
              <span style="font-size:20px">🧠</span>
              <div>
                <div class="mbti-card-type" style="color:${(MBTI_GROUPS.find(g=>g.types.includes(state.mbti))||{}).color||'#c084fc'}">${state.mbti} — ${MBTI_DESC[state.mbti]}</div>
                <div class="mbti-card-name">MBTIタイプ別アドバイス</div>
              </div>
            </div>
            <div class="mbti-row2 mbti-strength">
              <div class="mbti-row-label">💪 強みの活かし方</div>
              <div class="mbti-row-text">${res.mbtiAnalysis.strength}</div>
            </div>
            <div class="mbti-row2 mbti-weakness">
              <div class="mbti-row-label">⚠ このタイプのやりがちな失敗</div>
              <div class="mbti-row-text">${res.mbtiAnalysis.weakness}</div>
            </div>
            <div class="mbti-row2 mbti-tip">
              <div class="mbti-row-label">⚡ 最速で変わる具体策</div>
              <div class="mbti-row-text">${res.mbtiAnalysis.tip}</div>
            </div>
          </div>
        ` : ''}

        ${res.strategy ? `
          <div class="strat-card">
            <div class="strat-head"><span>🎯</span> 戦略プラン</div>
            <div class="strat-headline">${res.strategy.headline}</div>
            ${res.strategy.heightNote ? `<div class="strat-height">📏 ${res.strategy.heightNote}</div>` : ''}
            <div>
              ${res.strategy.actions.map(a => `
                <div class="strat-action">
                  <div class="strat-timing">${a.timing}</div>
                  <div class="strat-text">${a.action}</div>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${makeDCard(3, "🔍", "総合評価・優先アクション", res.overall)}

        <div class="future">
          <div class="f-head"><span>🚀</span> 改善後の未来シミュレーション</div>
          <div class="f-grid">
            <div class="f-cell">
              <div class="f-lbl">マッチ率</div>
              <div class="f-row"><div class="f-old">${res.matchRate}</div><div class="f-arr">→</div><div class="f-new">${Math.min(99, Math.round(res.matchRate*1.9+18))}<span class="f-u">%</span></div></div>
            </div>
            <div class="f-cell">
              <div class="f-lbl">デート成功率</div>
              <div class="f-row"><div class="f-old">${res.dateRate}</div><div class="f-arr">→</div><div class="f-new">${Math.min(99, Math.round(res.dateRate*2.1+15))}<span class="f-u">%</span></div></div>
            </div>
          </div>
        </div>

        <button class="btn-reset" onclick="app.reset()">🔄 もう一度診断する</button>
      `;

      document.getElementById('viewResult').innerHTML = html;

      // Animations
      setTimeout(() => {
        document.getElementById('rbarFill').style.width = `${res.percentile}%`;
        document.getElementById('rbarThumb').style.left = `${res.percentile}%`;
        animateCount(document.getElementById('scoreM'), res.matchRate);
        animateCount(document.getElementById('scoreD'), res.dateRate);
      }, 400);
    }

    function animateCount(elem, target, dur=1300) {
      if(!elem) return;
      let start = null;
      const step = ts => {
        if (!start) start = ts;
        const progress = Math.min((ts - start) / dur, 1);
        const p = 1 - Math.pow(1 - progress, 3);
        elem.innerHTML = `${Math.round(target * p)}<span class="score-pct">%</span>`;
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    }

    /* ─── Global App Controller ─── */
    window.app = {
      goStep: (n) => {
        switchStep(n);
        if(n === 0) renderStep0();
        if(n === 1) renderStep1();
        if(n === 2) renderStep2();
      },
      setGender: (g) => {
        state.gender = g;
        state.height = g === "male" ? 170 : 158;
        updateColors();
        renderStep0();
      },
      setMbti: (m) => {
        state.mbti = state.mbti === m ? "" : m;
        renderStep0();
      },
      updateProfile: (val) => {
        state.profile = val;
        document.getElementById('charCount').innerText = `${val.length} 字`;
        document.getElementById('s1Next').disabled = !val.trim();
      },
      updateHeight: (val) => {
        state.height = val;
        const cfg = HCfg[state.gender];
        const band = hBand(val, state.gender);
        const pct = ((val - cfg.min) / (cfg.max - cfg.min)) * 100;
        
        document.getElementById('hNum').style.color = band.c;
        document.getElementById('hNum').innerHTML = `${val}<span class="h-unit">cm</span>`;
        
        const hTag = document.getElementById('hTag');
        hTag.style.background = `${band.c}18`;
        hTag.style.color = band.c;
        hTag.innerText = band.t;

        const range = document.getElementById('hRange');
        range.style.setProperty('--sp', `${pct}%`);
        range.style.setProperty('--sc', band.c);

        let note = "";
        if(state.gender === "male") {
          if(val<165) note = `身長${val}cmはアプリでは<b>厳しい条件</b>。写真・プロフの質で徹底的に補う必要があります。`;
          else if(val<170) note = `身長${val}cmは平均以下。<b>写真と文章力</b>で差を埋めることは十分可能です。`;
          else if(val<175) note = `身長${val}cmは一般的な範囲。<b>他の要素の質</b>が勝負を分けます。`;
          else if(val<180) note = `身長${val}cmは<b>有利な水域</b>。他の要素を整えれば高いマッチ率が期待できます。`;
          else note = `身長${val}cmは<b>大きなアドバンテージ</b>。ただし身長だけでは勝てません。`;
        } else {
          if(val<153) note = `身長${val}cmは小柄。<b>かわいい系</b>の路線でプロフ・写真を統一すると効果的です。`;
          else if(val<160) note = `身長${val}cmは女性の平均域。<b>写真の撮り方</b>でスタイルを印象付けられます。`;
          else if(val<168) note = `身長${val}cmはやや高め。<b>スタイルの良さ</b>を自然にアピールできる強みです。`;
          else note = `身長${val}cmは高め。<b>雰囲気・スタイル</b>を活かした写真選びが重要です。`;
        }
        document.getElementById('hNote').innerHTML = note;
      },
      handleFile: (files) => {
        if(!files || !files[0] || !files[0].type.startsWith("image/")) return;
        state.photoFile = files[0];
        if(state.photoUrl) URL.revokeObjectURL(state.photoUrl);
        state.photoUrl = URL.createObjectURL(files[0]);
        renderStep2();
      },
      clearPhoto: (e) => {
        if(e) e.stopPropagation();
        state.photoFile = null;
        if(state.photoUrl) URL.revokeObjectURL(state.photoUrl);
        state.photoUrl = null;
        renderStep2();
      },
      analyze: async () => {
        switchStep('loading');
        state.resultImg = state.photoUrl;
        
        let msgIndex = 0;
        const msgElem = document.getElementById('loadingMsg');
        msgElem.innerText = LOAD_MSGS[0];
        const iv = setInterval(() => {
          msgIndex = (msgIndex + 1) % LOAD_MSGS.length;
          msgElem.innerText = LOAD_MSGS[msgIndex];
        }, 900);

        try {
          // Anthropic API fetch 処理（オリジナルコードのまま再現）
          const content = [];
          if (state.photoFile) {
            const b64 = await toB64(state.photoFile);
            content.push({type: "image", source: {type: "base64", media_type: state.photoFile.type || "image/jpeg", data: b64}});
          }
          content.push({type: "text", text: makePrompt(state.gender, state.profile, state.height, state.mbti, !!state.photoFile)});
          
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 3000, messages: [{ role: "user", content }] })
          });
          
          if (!res.ok) throw new Error('API Request Failed');
          
          const data = await res.json();
          const txt = data.content.map(b => b.text || "").join("");
          state.result = JSON.parse(txt.replace(/```json|```/g, "").trim());
        } catch (e) {
          console.warn("API Error (Using fallback):", e);
          state.result = makeFallback();
        } finally {
          clearInterval(iv);
          renderResult();
          switchStep('result');
        }
      },
      reset: () => {
        state.gender = "";
        state.mbti = "";
        state.height = 170;
        state.profile = "";
        state.photoFile = null;
        if(state.photoUrl) URL.revokeObjectURL(state.photoUrl);
        state.photoUrl = null;
        state.result = null;
        state.resultImg = null;
        app.goStep(0);
      }
    };

    // Initialize
    app.goStep(0);

  </script>
</body>
</html>
